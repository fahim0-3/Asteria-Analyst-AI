[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "asteria-analyst-api"
version = "1.0.0"
description = "Safe conversational analytics API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115", "uvicorn[standard]>=0.30", "sqlalchemy>=2.0",
  "pydantic-settings>=2.6", "python-multipart>=0.0.12", "pandas>=2.2",
  "openpyxl>=3.1", "pyarrow>=17", "sqlglot>=25", "PyJWT>=2.9",
  "cryptography>=43", "reportlab>=4.2", "alembic>=1.13", "psycopg[binary]>=3.2"
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.8", "mypy>=1.13"]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008", "E701", "E702", "UP042"]

[tool.black]
line-length = 100
target-version = ["py311"]
