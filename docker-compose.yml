services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: asteria_analytics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d asteria_analytics"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: {context: ., dockerfile: backend/Dockerfile}
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@db:5432/asteria_analytics
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-compose-secret-change-in-production}
      FRONTEND_URL: http://localhost:${FRONTEND_PORT:-5173}
    volumes: [uploads:/app/data/uploads, exports:/app/data/exports]
    ports: ["${BACKEND_PORT:-8000}:8000"]
    depends_on: {db: {condition: service_healthy}}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
  frontend:
    build: {context: ., dockerfile: frontend/Dockerfile}
    ports: ["${FRONTEND_PORT:-5173}:80"]
    depends_on: {backend: {condition: service_healthy}}
volumes:
  postgres_data: {}
  uploads: {}
  exports: {}
